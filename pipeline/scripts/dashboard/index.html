<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline</title>
<style>
  /* Adapted by hand from tonylxm/micro-animated-ui-component-library: tactile.css v0.1.2, button v0.1.0,
     skeleton v0.1.2, and the shadcn neutral theme from its index.css. Compare versions there to see drift. */
  @font-face { font-family: "Geist Variable"; src: url("/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: light dark;
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --border: oklch(0.922 0 0); --ring: oklch(0.708 0 0); --destructive: oklch(0.577 0.245 27.325);
    --pass: oklch(0.527 0.154 150); --changes: oklch(0.555 0.15 65);
    --radius: 0.625rem;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-slide: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: linear(0, 0.22 8%, 0.72 20%, 1.04 34%, 1.07 40%, 0.98 56%, 1.01 72%, 1);
    --duration-press: 140ms; --duration-release: 200ms; --duration-slide: 280ms; --duration-shimmer: 1.5s;
    --press-scale: 0.97;
    --raised-highlight: inset 0 1px 0 rgb(255 255 255 / 0.2);
    --raised-highlight-pressed: inset 0 1px 0 rgb(255 255 255 / 0);
    --raised-shadow: 0 1px 1px rgb(0 0 0 / 0.1), 0 2px 4px -1px rgb(0 0 0 / 0.14);
    --raised-shadow-pressed: 0 0 0 rgb(0 0 0 / 0.1), 0 1px 1px -1px rgb(0 0 0 / 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
      --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
      --border: oklch(1 0 0 / 10%); --ring: oklch(0.556 0 0); --destructive: oklch(0.704 0.191 22.216);
      --pass: oklch(0.78 0.16 150); --changes: oklch(0.82 0.15 80);
      --raised-highlight: inset 0 1px 0 rgb(255 255 255 / 0.08);
      --raised-shadow: 0 1px 1px rgb(0 0 0 / 0.4), 0 2px 6px -1px rgb(0 0 0 / 0.5);
      --raised-shadow-pressed: 0 0 0 rgb(0 0 0 / 0.4), 0 1px 1px -1px rgb(0 0 0 / 0.4);
    }
  }
  * { box-sizing: border-box; border-color: var(--border); }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 "Geist Variable", ui-sans-serif, system-ui, sans-serif; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { text-wrap: pretty; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted-foreground); }
  a { color: inherit; text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 1px; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; flex: none; }

  /* Button: tactile press from button.tsx */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; font: inherit; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.8); background: var(--background); color: var(--foreground);
    box-shadow: var(--raised-shadow), var(--raised-highlight);
    transition: scale var(--duration-release) var(--ease-spring), translate var(--duration-release) var(--ease-spring), box-shadow var(--duration-release) var(--ease-spring), background-color var(--duration-release); }
  .btn:hover { background: var(--muted); }
  .btn:active { scale: var(--press-scale); translate: 0 1px; box-shadow: var(--raised-shadow-pressed), var(--raised-highlight-pressed); transition-duration: var(--duration-press); transition-timing-function: var(--ease-out); }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn.ghost { border-color: transparent; box-shadow: none; background: transparent; }
  .btn.ghost:hover { background: var(--muted); }
  .btn.icon { width: 32px; padding: 0; }

  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; white-space: nowrap; color: var(--muted-foreground); }
  .badge.pass { color: var(--pass); border-color: color-mix(in oklch, var(--pass) 40%, transparent); background: color-mix(in oklch, var(--pass) 10%, transparent); }
  .badge.changes { color: var(--changes); border-color: color-mix(in oklch, var(--changes) 40%, transparent); background: color-mix(in oklch, var(--changes) 10%, transparent); }
  .badge.fail { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); }
  .badge.wait { border-style: dashed; }

  .skeleton { border-radius: calc(var(--radius) * 0.6); background-color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .skeleton { background-image: linear-gradient(90deg, var(--muted) 40%, color-mix(in oklch, var(--muted), var(--foreground) 6%) 50%, var(--muted) 60%); background-size: 200% 100%; background-attachment: fixed; animation: shimmer var(--duration-shimmer) linear infinite; }
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @keyframes fade-in { from { opacity: 0; } }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px; }
  header h1 { font-size: 18px; }
  .head-r { display: flex; align-items: center; gap: 12px; }
  #summary { padding: 0 16px 12px; margin: 0; }
  #error { margin: 0 16px 12px; padding: 12px 16px; border: 1px solid var(--destructive); border-radius: var(--radius); }

  .strip { margin: 0 16px 16px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border)); border-radius: var(--radius); background: color-mix(in oklch, var(--destructive) 5%, var(--card)); }
  .strip h2, .col h2 { font-size: 13px; font-weight: 600; }
  .strip > h2 { padding: 10px 16px 0; }
  .need { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--border); margin-top: 10px; }
  .need + .need { margin-top: 0; }
  .need .why { flex-basis: 100%; }
  .need .btn { padding: 0; height: auto; font-weight: 600; text-align: left; }

  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 0 16px 16px; }
  .col { min-width: 0; background: var(--muted); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px; }
  .empty { padding: 8px 4px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.8); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; box-shadow: var(--raised-shadow);
    transition: scale var(--duration-release) var(--ease-spring), box-shadow var(--duration-release) var(--ease-spring); }
  .card:active { scale: var(--press-scale); box-shadow: var(--raised-shadow-pressed); transition-duration: var(--duration-press); transition-timing-function: var(--ease-out); }
  .card .repo { font-size: 12px; overflow-wrap: anywhere; }
  .card .title { font-weight: 500; overflow-wrap: anywhere; }
  .card .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .card.unknown { border-color: var(--destructive); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); }
  @media (prefers-reduced-motion: no-preference) { .live { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .details { margin: 0 16px 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
  .details summary { padding: 12px 16px; cursor: pointer; font-weight: 600; }
  .details .body { padding: 0 16px 12px; display: grid; gap: 6px; }
  .details h3 { font-size: 13px; margin-top: 8px; }

  /* Sheet: <dialog> docked right. Enter on the slide curve, exit 20% shorter. */
  dialog.sheet { margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(760px, 100vw); max-width: none; padding: 0; border: 0; border-left: 1px solid var(--border); background: var(--background); color: var(--foreground);
    translate: 0; opacity: 1; transition: translate var(--duration-slide) var(--ease-slide), opacity var(--duration-slide) var(--ease-slide), overlay var(--duration-slide) allow-discrete, display var(--duration-slide) allow-discrete; }
  dialog.sheet::backdrop { background: rgb(0 0 0 / 0.4); transition: opacity var(--duration-slide) var(--ease-slide); }
  @starting-style { dialog.sheet[open] { translate: 100% 0; opacity: 0; } dialog.sheet[open]::backdrop { opacity: 0; } }
  dialog.sheet.closing { translate: 100% 0; opacity: 0; transition-duration: 224ms; }
  dialog.sheet.closing::backdrop { opacity: 0; transition-duration: 224ms; }
  @media (prefers-reduced-motion: reduce) { dialog.sheet, dialog.sheet.closing { transition: none; translate: 0; } @starting-style { dialog.sheet[open] { translate: 0; opacity: 1; } } }
  .sheet-in { display: flex; flex-direction: column; height: 100%; }
  .sheet-head { display: flex; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
  .sheet-head h2 { font-size: 16px; overflow-wrap: anywhere; }
  .sheet-body { overflow-y: auto; padding: 16px; display: grid; gap: 16px; align-content: start; flex: 1; animation: fade-in var(--duration-release) var(--ease-out); }
  .ev { border: 1px solid var(--border); border-radius: calc(var(--radius) * 0.8); padding: 12px; display: grid; gap: 8px; }
  .ev-head { display: flex; align-items: center; gap: 8px; }
  .round { font-size: 12px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
  .md { overflow-wrap: anywhere; display: grid; gap: 8px; max-width: 70ch; }
  .md > * { margin: 0; }
  .md pre { background: var(--muted); padding: 8px 12px; border-radius: calc(var(--radius) * 0.6); overflow-x: auto; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--muted); padding: 0 4px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .md ul, .md ol { padding-left: 20px; }
  .finding { display: flex; gap: 8px; align-items: baseline; }

  @media (max-width: 1100px) {
    .board { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(240px, 40%); overflow-x: auto; scroll-snap-type: x proximity; }
    .col { scroll-snap-align: start; }
  }
  @media (max-width: 640px) {
    .board { grid-auto-flow: row; grid-auto-columns: auto; overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>Pipeline</h1>
  <div class="head-r">
    <span id="updated" class="muted mono" role="status" aria-live="polite"></span>
    <button id="refresh" class="btn" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Refresh</button>
  </div>
</header>
<p id="summary" class="muted">Loading</p>
<div id="error" role="alert" hidden></div>
<section id="strip" class="strip" aria-labelledby="h-needs" hidden></section>
<main id="board" class="board" aria-label="Jobs by stage"></main>
<details class="details"><summary>Repeating problems and skill health</summary><div class="body" id="more"></div></details>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-in">
    <div class="sheet-head">
      <div><h2 id="sheet-title"></h2><div id="sheet-links" class="muted"></div></div>
      <button id="sheet-close" class="btn ghost icon" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</dialog>

<script>
// Icons: Lucide (ISC), see THIRD_PARTY_NOTICES.md.
const ICON = {
  pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const svg = (name) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = ICON[name]; return s; };
const $ = (id) => document.getElementById(id);
// GitHub text is untrusted: everything goes through textContent, and hrefs are checked.
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? (n.className = v) : k === 'text' ? (n.textContent = v) : n.setAttribute(k, v);
  n.append(...kids.filter((k) => k != null));
  return n;
};
const safeRepo = (r) => /^[\w.-]+\/[\w.-]+$/.test(r);
const safeUrl = (u) => /^https:\/\//.test(u);
const link = (href, text, ...icon) => (safeUrl(href) ? el('a', { href, target: '_blank', rel: 'noreferrer noopener' }, ...icon, text) : el('span', {}, text));
const issueUrl = (repo, n) => `https://github.com/${repo}/issues/${n}`;

async function get(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

// ---- markdown: headings, fences, lists, paragraphs, inline code, bold, https links. Nodes only, no innerHTML.
function inline(text) {
  const out = document.createDocumentFragment();
  const re = /`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.append(text.slice(last, m.index));
    out.append(m[1] ? el('code', { text: m[1] }) : m[2] ? el('strong', { text: m[2] }) : el('a', { href: m[4], target: '_blank', rel: 'noreferrer noopener', text: m[3] }));
    last = re.lastIndex;
  }
  out.append(text.slice(last));
  return out;
}
function markdown(src) {
  const box = el('div', { class: 'md' });
  const lines = String(src ?? '').replace(/<!--[\s\S]*?-->/g, '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l.trim()) continue;
    if (l.startsWith('```')) {
      const code = [];
      while (++i < lines.length && !lines[i].startsWith('```')) code.push(lines[i]);
      box.append(el('pre', {}, el('code', { text: code.join('\n') })));
    } else if (/^#{1,4}\s/.test(l)) {
      box.append(el('h3', {}, inline(l.replace(/^#+\s*/, ''))));
    } else if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), list = el(ordered ? 'ol' : 'ul');
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) list.append(el('li', {}, inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))));
      i--;
      box.append(list);
    } else {
      const para = [l];
      while (i + 1 < lines.length && lines[i + 1].trim() && !/^(```|#|\s*([-*]|\d+\.)\s)/.test(lines[i + 1])) para.push(lines[++i]);
      box.append(el('p', {}, inline(para.join(' '))));
    }
  }
  return box;
}

// ---- helpers
const tone = (v) => (v === 'PASS' || v === 'APPROVE' || v === 'DONE' ? 'pass' : v === 'CHANGES' ? 'changes' : v ? 'fail' : 'wait');
const chip = (label, verdict) => el('span', { class: `badge ${tone(verdict)}`, title: verdict ?? 'pending' }, `${label} ${verdict ? verdict.toLowerCase() : 'pending'}`);
const ago = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  return m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m ago`;
};
const COLS = [
  ['ready', 'Ready'], ['build', 'Build'], ['checks', 'Checks'], ['review', 'Review'], ['final', 'Final'], ['done', 'Done'],
];
const COL_OF = { build: 'build', checks: 'checks', review: 'review', final: 'final', merge: 'final' };
const SHORT = { security: 'sec' };

// ---- cards
function card(item, kind) {
  const b = el('button', { class: 'card', type: 'button' });
  b.append(el('div', { class: 'repo muted mono', text: item.repo }));
  const title = el('div', { class: 'title' });
  if (kind === 'live') title.append(el('span', { class: 'live', 'aria-hidden': 'true' }), ' ');
  title.append(`#${item.number} ${item.title}`);
  b.append(title);
  if (item.meta) b.append(el('div', { class: 'row' }, el('span', { class: 'badge', text: item.meta.size }), ...item.meta.risk.map((r) => el('span', { class: 'badge', text: r }))));
  for (const [i, r] of (item.rounds ?? []).entries()) {
    const row = el('div', { class: 'row' }, el('span', { class: 'mono muted', text: `R${i + 1}` }), chip('checks', r.build === 'BLOCKED' ? 'BLOCKED' : r.checks));
    if (r.checks === 'PASS') for (const m of item.required) row.append(chip(SHORT[m] ?? m, r.reviews[m]));
    b.append(row);
  }
  if (kind === 'live') b.append(el('div', { class: 'muted mono', text: item.pr ? `PR #${item.pr.number} opened ${ago(item.pr.createdAt)}` : 'building, no PR yet' }));
  if (kind === 'done') b.append(el('div', { class: 'row' }, chip('merged', 'PASS')));
  if (kind === 'unknown') { b.classList.add('unknown'); b.append(el('div', { class: 'muted', text: `Unknown phase "${item.phase}"` })); }
  // Merged items are PRs, not issues: there is nothing more to load, so go to the PR.
  b.addEventListener('click', () => (kind === 'done' ? safeUrl(item.url) && window.open(item.url, '_blank', 'noopener') : openSheet(item)));
  return b;
}

let loadedOnce = false, skeletonAt = 0;
function skeletonBoard() {
  $('board').replaceChildren(...COLS.map(([, label]) => el('section', { class: 'col' }, el('h2', { text: label }), el('div', { class: 'skeleton', style: 'height:72px' }), el('div', { class: 'skeleton', style: 'height:72px' }))));
}

function render(state) {
  const all = (key) => state.repos.flatMap((x) => x[key].map((i) => ({ ...i, repo: x.repo })));
  const ready = all('ready'), jobs = all('inProgress'), human = all('needsHuman'), merged = all('mergedToday');
  const stuck = jobs.filter((j) => j.phase === 'blocked' || j.phase === 'escalated');
  const cols = Object.fromEntries(COLS.map(([k]) => [k, []]));
  cols.ready = ready.map((i) => card(i, 'ready'));
  cols.done = merged.map((i) => card(i, 'done'));
  const unknown = [];
  for (const j of jobs) {
    if (stuck.includes(j)) continue;
    const c = COL_OF[j.phase];
    c ? cols[c].push(card(j, 'live')) : unknown.push(card(j, 'unknown'));
  }
  const needCount = human.length + stuck.length;
  $('summary').replaceChildren(el('strong', { text: needCount ? `${needCount} need${needCount === 1 ? 's' : ''} you` : 'Nothing needs you' }),
    `, ${jobs.length - stuck.length} running, ${ready.length} ready, ${merged.length} merged today.`);

  const strip = $('strip');
  strip.hidden = !needCount;
  if (needCount) {
    strip.replaceChildren(el('h2', { id: 'h-needs', text: 'Needs you' }),
      ...human.map((n) => needRow(n, n.reason, 'Open the PR, or run /plan on the issue.')),
      ...stuck.map((j) => needRow(j, j.detail, j.phase === 'blocked' ? 'Build is blocked: answer on the PR, then re-run.' : 'Read the final review and decide.')));
  }
  $('board').replaceChildren(...COLS.map(([k, label]) => el('section', { class: 'col', 'aria-label': label },
    el('div', { class: 'col-head' }, el('h2', { text: label }), el('span', { class: 'muted mono', text: cols[k].length })),
    ...(cols[k].length ? cols[k] : [el('div', { class: 'empty muted', text: EMPTY[k] })]),
    ...(k === 'build' ? unknown : []))));
  $('updated').textContent = `Updated ${new Date(state.generatedAt).toLocaleTimeString()}`;
}
const EMPTY = {
  ready: 'Queue is empty. Run /plan to ready some issues.', build: 'No builds running. Start: node run.mjs', checks: 'Nothing in checks.',
  review: 'Nothing in review.', final: 'Nothing waiting for final review.', done: 'Nothing merged yet today.',
};
function needRow(item, why, next) {
  const row = el('div', { class: 'need' }, el('span', { class: 'mono muted', text: item.repo }),
    el('button', { class: 'btn ghost', type: 'button', text: `#${item.number} ${item.title}` }));
  row.lastChild.addEventListener('click', () => openSheet(item));
  row.append(el('div', { class: 'why muted' }, svg('alert'), ` ${why}. ${next}`));
  return row;
}

function renderMore(retro, health) {
  const body = $('more');
  body.replaceChildren(el('h3', { text: 'Repeating problems' }));
  if (!retro) body.append(el('div', { class: 'muted', text: 'No retro yet. Run: node run.mjs retro' }));
  else {
    const rec = retro.recurring;
    const rows = [...rec.findingCategories.map((x) => `Review finding: ${x.key}`), ...rec.escalations.map((x) => `Escalation: ${x.key}`), ...rec.checkFailures.map((x) => x.key)];
    const counts = [...rec.findingCategories, ...rec.escalations, ...rec.checkFailures].map((x) => x.n);
    if (!rows.length) body.append(el('div', { class: 'muted', text: `Nothing repeated 3 times in ${retro.jobs} jobs since ${retro.since}.` }));
    rows.forEach((r, i) => body.append(el('div', {}, el('span', { class: 'badge mono', text: `${counts[i]} times` }), ` ${r}`)));
  }
  body.append(el('h3', { text: 'Skill health' }));
  if (!health.length) body.append(el('div', { class: 'muted', text: 'docs/skill-health.md has no rows.' }));
  for (const h of health) body.append(el('div', {}, el('span', { class: `badge${h.status.startsWith('new') ? ' changes' : ''}`, text: h.status }), ` ${h.skill}. Last dry run: ${h.lastRun}. ${h.notes}`));
}

// ---- sheet
const sheet = $('sheet');
let openItem = null, opener = null;
function closeSheet() {
  if (!sheet.open) return;
  openItem = null;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { sheet.close(); return; }
  sheet.classList.add('closing');
  setTimeout(() => { sheet.close(); sheet.classList.remove('closing'); }, 224);
}
sheet.addEventListener('cancel', (e) => { e.preventDefault(); closeSheet(); });
sheet.addEventListener('close', () => opener?.focus());
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
$('sheet-close').addEventListener('click', closeSheet);

async function openSheet(item) {
  opener = document.activeElement;
  openItem = item;
  $('sheet-title').textContent = `#${item.number} ${item.title}`;
  $('sheet-links').replaceChildren(el('span', { class: 'mono', text: item.repo }), ' · ',
    safeRepo(item.repo) ? link(issueUrl(item.repo, item.number), 'issue', ' ') : '',
    item.pr ? el('span', {}, ' · ', link(item.pr.url, `PR #${item.pr.number}`, svg('pr'), ' ')) : '');
  $('sheet-body').replaceChildren(el('div', { class: 'skeleton', style: 'height:96px' }), el('div', { class: 'skeleton', style: 'height:96px' }));
  if (!sheet.open) sheet.showModal();
  try {
    const d = await get(`/api/job?repo=${encodeURIComponent(item.repo)}&n=${item.number}`);
    if (openItem !== item) return;
    const body = $('sheet-body');
    body.replaceChildren(el('section', {}, el('div', { class: 'round', text: 'Issue' }), markdown(d.issue)));
    let round = 0;
    for (const e of d.events) {
      if (e.stage === 'build') body.append(el('div', { class: 'round', text: `Round ${++round}` }));
      body.append(el('article', { class: 'ev' },
        el('div', { class: 'ev-head' }, el('strong', { text: e.stage }), el('span', { class: `badge ${tone(e.verdict)}`, text: e.verdict })),
        markdown(e.summary),
        ...e.findings.map((f) => el('div', { class: 'finding' }, el('span', { class: `badge ${f.severity === 'blocker' ? 'fail' : 'changes'}`, text: f.severity ?? 'note' }), el('span', {}, f.issue ?? ''), f.category ? el('span', { class: 'muted mono', text: f.category }) : null))));
    }
    if (!d.events.length) body.append(el('div', { class: 'muted', text: 'No verdicts yet: the build has not opened a PR.' }));
  } catch (err) {
    $('sheet-body').replaceChildren(el('div', { class: 'muted', text: `Could not load: ${err.message}` }));
  }
}

// ---- load
async function load() {
  $('refresh').disabled = true;
  // First load only: show a skeleton after 150ms, and keep it at least 300ms, so a fast load never flashes one.
  const timer = !loadedOnce && setTimeout(() => { skeletonAt = Date.now(); skeletonBoard(); }, 150);
  try {
    const [state, retro, health] = await Promise.all([get('/api/state'), get('/api/retro'), get('/api/health')]);
    clearTimeout(timer);
    if (skeletonAt) await new Promise((r) => setTimeout(r, Math.max(0, 300 - (Date.now() - skeletonAt))));
    skeletonAt = 0; loadedOnce = true;
    $('error').hidden = true;
    render(state); renderMore(retro, health);
  } catch (e) {
    clearTimeout(timer);
    $('error').hidden = false;
    $('error').replaceChildren(el('div', { text: `Could not load state: ${e.message}` }), el('div', { class: 'muted', text: 'Check that gh is signed in (gh auth status) and repos.txt lists your repos.' }));
  } finally {
    $('refresh').disabled = false;
  }
}
$('refresh').addEventListener('click', load);
setInterval(() => { if (!document.hidden) load(); }, 20000);
load();
</script>
</body>
</html>
