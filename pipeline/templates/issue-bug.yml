name: Bug
description: Something is broken
title: "fix: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Include the page or command, and any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Skip if unknown.
